[project]
name = "llm-engram"
version = "0.1.1"
description = "Durable, explainable long-term memory for the llm CLI, powered by Engram (Lumetra)"
readme = "README.md"
authors = [{name = "Lumetra", email = "founders@lumetra.io"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["llm", "memory", "engram", "lumetra", "tools", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "llm>=0.26",
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://github.com/lumetra-io/engram-llm"
Documentation = "https://lumetra.io/docs"
Issues = "https://github.com/lumetra-io/engram-llm/issues"
Changelog = "https://github.com/lumetra-io/engram-llm/releases"

[project.entry-points.llm]
engram = "llm_engram"

[project.optional-dependencies]
test = ["pytest", "pytest-httpx"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_engram*"]
